services:
  - type: web
    name: neet-practice-solver
    runtime: node
    plan: free
    buildCommand: npm install && npm test && npm run check
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: GEMINI_API_KEY
        sync: false
